name: Deploy to GitHub Pages

on:
  push:
    branches:
      - Master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Configure Git
        run: |
          git config --global user.name "MTCodes01"
          git config --global user.email "108288413+MTCodes01@users.noreply.github.com"

      - name: Deploy
        run: npm run deploy